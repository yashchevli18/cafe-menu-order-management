services:
  - type: web
    name: brew-and-bean-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: MANAGEMENT_API_KEY
        generateValue: true
